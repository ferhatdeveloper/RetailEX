name: Desktop Portable Release

# RetailEX Tauri masaüstü portable
# Full: RetailEX-{version}.exe — NSIS + admin hizmetler (tag portable-v*)
# Soft: RetailEX-Soft-{version}.zip — hizmetsiz deneme (tag portable-soft-v*)
#
# Tetikleme:
#   git tag portable-v0.1.271 && git push origin portable-v0.1.271
#   git tag portable-soft-v0.1.271 && git push origin portable-soft-v0.1.271
#   Actions → Run workflow → profile: full | soft | both (varsayılan: both)

on:
  push:
    tags:
      - 'portable-v*'
      - 'portable-soft-v*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'full = EXE+hizmetler · soft = Soft ZIP · both = ikisi'
        type: choice
        options:
          - both
          - full
          - soft
        default: both

permissions:
  contents: write

jobs:
  build-windows-portable:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard origin product (RetailEX)
        shell: pwsh
        run: |
          $url = git remote get-url origin
          if ($url -notmatch 'RetailEX') {
            throw "origin RetailEX degil: $url — AsinERP portable bu workflow ile yayinlanamaz."
          }
          Write-Host "origin OK: $url"

      - name: Resolve profile + tags
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          echo "PACKAGE_VERSION=$v" >> $env:GITHUB_ENV

          $profile = "full"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $profile = "${{ github.event.inputs.profile }}"
            if (-not $profile) { $profile = "both" }
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $ref = "${{ github.ref_name }}"
            if ($ref -like "portable-soft-v*") {
              $profile = "soft"
            } else {
              $profile = "full"
            }
          }

          if ($profile -notin @("full","soft","both")) {
            throw "Gecersiz profile: $profile"
          }
          echo "PORTABLE_PROFILE=$profile" >> $env:GITHUB_ENV
          $buildFull = ($profile -eq "full" -or $profile -eq "both")
          $buildSoft = ($profile -eq "soft" -or $profile -eq "both")
          echo "BUILD_FULL=$([int]$buildFull)" >> $env:GITHUB_ENV
          echo "BUILD_SOFT=$([int]$buildSoft)" >> $env:GITHUB_ENV

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref }}" -like "refs/tags/portable-soft-v*") {
            echo "RELEASE_TAG_SOFT=${{ github.ref_name }}" >> $env:GITHUB_ENV
            echo "RELEASE_TAG_FULL=" >> $env:GITHUB_ENV
          } elseif ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref }}" -like "refs/tags/portable-v*") {
            echo "RELEASE_TAG_FULL=${{ github.ref_name }}" >> $env:GITHUB_ENV
            echo "RELEASE_TAG_SOFT=" >> $env:GITHUB_ENV
          } else {
            if ($buildFull) { echo "RELEASE_TAG_FULL=portable-v$v" >> $env:GITHUB_ENV } else { echo "RELEASE_TAG_FULL=" >> $env:GITHUB_ENV }
            if ($buildSoft) { echo "RELEASE_TAG_SOFT=portable-soft-v$v" >> $env:GITHUB_ENV } else { echo "RELEASE_TAG_SOFT=" >> $env:GITHUB_ENV }
          }

          Write-Host "profile=$profile full=$buildFull soft=$buildSoft v=$v"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install NSIS (makensis)
        if: env.BUILD_FULL == '1'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $makensis = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis bulunamadi (choco nsis)" }
          echo "MAKENSIS=$makensis" >> $env:GITHUB_ENV
          & $makensis /VERSION

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './DeskApp -> target'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Configure Windows code signing
        shell: pwsh
        env:
          SIGN_THUMB: ${{ secrets.WINDOWS_CODESIGN_THUMBPRINT }}
          SIGN_PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          SIGN_PFX_PASS: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CERT_FINGERPRINT: ${{ secrets.SM_CERT_FINGERPRINT }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
        run: |
          $hasSign = $false
          if ($env:SIGN_PFX_B64) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGN_PFX_B64))
            $pass = ConvertTo-SecureString $env:SIGN_PFX_PASS -AsPlainText -Force
            Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $pass | Out-Null
            Write-Host "Kod imza PFX magazaya aktarildi."
            $hasSign = $true
          }
          if ($env:SM_CLIENT_CERT_FILE_B64) {
            $p12Path = Join-Path $env:RUNNER_TEMP "digicert_client.p12"
            [IO.File]::WriteAllBytes($p12Path, [Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64))
            echo "SM_CLIENT_CERT_FILE=$p12Path" >> $env:GITHUB_ENV
            $hasSign = $true
          }
          if ($env:SM_API_KEY) { echo "SM_API_KEY=$env:SM_API_KEY" >> $env:GITHUB_ENV; $hasSign = $true }
          if ($env:SM_CERT_FINGERPRINT) { echo "SM_CERT_FINGERPRINT=$env:SM_CERT_FINGERPRINT" >> $env:GITHUB_ENV; $hasSign = $true }
          if ($env:SM_CLIENT_CERT_PASSWORD) { echo "SM_CLIENT_CERT_PASSWORD=$env:SM_CLIENT_CERT_PASSWORD" >> $env:GITHUB_ENV }
          if ($env:SIGN_THUMB) {
            echo "WINDOWS_CODESIGN_THUMBPRINT=$env:SIGN_THUMB" >> $env:GITHUB_ENV
            $hasSign = $true
          }
          if ($hasSign) {
            echo "CODESIGN_ENABLED=1" >> $env:GITHUB_ENV
            Write-Host "Kod imzalama etkin (portable)."
          } else {
            echo "WINDOWS_CODESIGN_DISABLE=1" >> $env:GITHUB_ENV
            echo "CODESIGN_ENABLED=0" >> $env:GITHUB_ENV
            Write-Host "Imza secret yok; imzasiz portable (SAC musteride engelleyebilir)."
          }

      - name: Fetch Windows extras (Sumatra, PostgREST, Node)
        shell: pwsh
        run: |
          npm run sumatra:fetch
          if ($LASTEXITCODE -ne 0) { throw "sumatra:fetch failed: $LASTEXITCODE" }
          if ($env:BUILD_FULL -eq "1") {
            npm run postgrest:fetch
            if ($LASTEXITCODE -ne 0) { throw "postgrest:fetch failed: $LASTEXITCODE" }
          }
          npm run node-runtime:fetch
          if ($LASTEXITCODE -ne 0) { throw "node-runtime:fetch failed: $LASTEXITCODE" }
          # WhatsApp Baileys bridge prebundle (RetailEX_WA_Bridge.exe icin node_modules)
          npm run whatsapp:bridge:prebundle
          if ($LASTEXITCODE -ne 0) { throw "whatsapp:bridge:prebundle failed: $LASTEXITCODE" }

      - name: Sync app version + prebuild extras
        shell: pwsh
        env:
          WINDOWS_CODESIGN_DISABLE: ${{ env.WINDOWS_CODESIGN_DISABLE }}
          WINDOWS_CODESIGN_THUMBPRINT: ${{ env.WINDOWS_CODESIGN_THUMBPRINT }}
        run: npm run prebuild

      - name: Build Tauri (no DeskApp NSIS bundle)
        shell: pwsh
        env:
          CI: 'true'
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
          WINDOWS_CODESIGN_DISABLE: ${{ env.WINDOWS_CODESIGN_DISABLE }}
          WINDOWS_CODESIGN_THUMBPRINT: ${{ env.WINDOWS_CODESIGN_THUMBPRINT }}
        run: node scripts/tauri-build-portable.mjs

      - name: Sign release binaries (if secrets)
        shell: pwsh
        env:
          WINDOWS_CODESIGN_DISABLE: ${{ env.WINDOWS_CODESIGN_DISABLE }}
          WINDOWS_CODESIGN_THUMBPRINT: ${{ env.WINDOWS_CODESIGN_THUMBPRINT }}
          SM_CERT_FINGERPRINT: ${{ env.SM_CERT_FINGERPRINT }}
        run: |
          $rel = "DeskApp/target/release"
          $bins = @(
            "retailex.exe","RetailEX_Service.exe","RetailEX_Config.exe",
            "RetailEX_SQL_Bridge.exe","RetailEX_Printer.exe","RetailEX_Tools.exe"
          ) | ForEach-Object { Join-Path $rel $_ } | Where-Object { Test-Path $_ }
          if ($bins.Count -gt 0) {
            & .\scripts\sign-portable-binaries.ps1 -Paths $bins
            if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Pack portable Full EXE (admin + services)
        if: env.BUILD_FULL == '1'
        shell: pwsh
        env:
          MAKENSIS: ${{ env.MAKENSIS }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          node scripts/pack-retailex-portable-zip.mjs
          $exe = "dist/RetailEX-$env:PACKAGE_VERSION.exe"
          if (-not (Test-Path $exe)) { throw "Portable EXE yok: $exe" }
          echo "PORTABLE_EXE=RetailEX-$env:PACKAGE_VERSION.exe" >> $env:GITHUB_ENV
          (Get-Item $exe).Length | Out-Host

      - name: Pack portable Soft ZIP (no services)
        if: env.BUILD_SOFT == '1'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          node scripts/pack-retailex-portable-zip.mjs --soft
          $zip = "dist/RetailEX-Soft-$env:PACKAGE_VERSION.zip"
          if (-not (Test-Path $zip)) { throw "Portable Soft ZIP yok: $zip" }
          echo "PORTABLE_SOFT_ZIP=RetailEX-Soft-$env:PACKAGE_VERSION.zip" >> $env:GITHUB_ENV
          (Get-Item $zip).Length | Out-Host

      - name: Sign portable installer EXE (if secrets)
        if: env.BUILD_FULL == '1'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_DISABLE: ${{ env.WINDOWS_CODESIGN_DISABLE }}
          WINDOWS_CODESIGN_THUMBPRINT: ${{ env.WINDOWS_CODESIGN_THUMBPRINT }}
          SM_CERT_FINGERPRINT: ${{ env.SM_CERT_FINGERPRINT }}
        run: |
          $exe = "dist/RetailEX-$env:PACKAGE_VERSION.exe"
          & .\scripts\sign-portable-binaries.ps1 -Paths @($exe)
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload Full artifact
        if: env.BUILD_FULL == '1'
        uses: actions/upload-artifact@v6
        with:
          name: RetailEX-${{ env.PACKAGE_VERSION }}
          path: dist/RetailEX-${{ env.PACKAGE_VERSION }}.exe
          retention-days: 30

      - name: Upload Soft artifact
        if: env.BUILD_SOFT == '1'
        uses: actions/upload-artifact@v6
        with:
          name: RetailEX-Soft-${{ env.PACKAGE_VERSION }}
          path: dist/RetailEX-Soft-${{ env.PACKAGE_VERSION }}.zip
          retention-days: 30

      - name: Create Full GitHub Release
        if: env.BUILD_FULL == '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG_FULL }}
          name: RetailEX ${{ env.PACKAGE_VERSION }}
          body: |
            ## RetailEX (Windows EXE — Full)

            Yönetici kurulum — otomatik derleme: `${{ github.workflow }}` (#${{ github.run_number }})

            ### Kurulum
            1. `RetailEX-${{ env.PACKAGE_VERSION }}.exe` indirin ve **Yönetici** olarak çalıştırın (UAC: Evet)
            2. Varsayılan dizin: `C:\RetailEx\App`
            3. Kurulum Sync, SQL Bridge, Printer, PostgREST hizmetlerini kurar

            ### Akilli Uygulama Denetimi (SAC) engellediyse
            1. Windows Guvenlik → Uygulama ve tarayici denetimi → **Akilli Uygulama Denetimi = Kapali**
            2. `C:\RetailEx\App\unblock-and-install-services.cmd` (Yonetici)

            ### Hizmet kurtarma
            `C:\RetailEx\App\install-services-manual.cmd` veya `unblock-and-install-services.cmd`

            ### Güncelleme
            `RetailEX_Tools.exe` → **Güncelle (portable)** veya `RetailEX_Tools.exe update`
            (yalnızca Full EXE; Soft ZIP güncelleme kanalı değildir)

            Sürüm: `${{ env.PACKAGE_VERSION }}`
          files: dist/RetailEX-${{ env.PACKAGE_VERSION }}.exe
          draft: false
          prerelease: false
          make_latest: false
          generate_release_notes: false

      - name: Create Soft GitHub Release
        if: env.BUILD_SOFT == '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG_SOFT }}
          name: RetailEX Soft ${{ env.PACKAGE_VERSION }}
          body: |
            ## RetailEX Soft (Windows ZIP — deneme)

            Hizmetsiz hızlı deneme paketi — `${{ github.workflow }}` (#${{ github.run_number }})

            ### Kullanım
            1. `RetailEX-Soft-${{ env.PACKAGE_VERSION }}.zip` indirip bir klasöre açın
            2. `RetailEX_Config.exe` ile config ayarlayın
            3. `retailex.exe` çalıştırın

            ### Not
            - Windows hizmeti kurulmaz (Sync / SQL Bridge / Printer / PostgREST yok).
            - Müşteri / üretim için Full kullanın: `RetailEX-${{ env.PACKAGE_VERSION }}.exe` (`portable-v*` tag).
            - `RetailEX_Tools update` Soft ZIP indirmez.

            Sürüm: `${{ env.PACKAGE_VERSION }}`
          files: dist/RetailEX-Soft-${{ env.PACKAGE_VERSION }}.zip
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: false
