name: Desktop App Release

# RetailEX Tauri masaüstü (Windows NSIS kurulumu)
# Tetikleme:
#   git tag app-v0.1.85 && git push origin app-v0.1.85
# veya Actions → "Desktop App Release" → Run workflow

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read package version
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          echo "PACKAGE_VERSION=$v" >> $env:GITHUB_ENV
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref }}" -like "refs/tags/app-v*") {
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $env:GITHUB_ENV
          } else {
            echo "RELEASE_TAG=app-v$v" >> $env:GITHUB_ENV
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify Rust toolchain
        shell: pwsh
        run: rustc --version

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './DeskApp -> target'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Tauri (Windows)
        shell: pwsh
        env:
          CI: 'true'
          WINDOWS_CODESIGN_DISABLE: '1'
        run: npm run tauri:build

      - name: Collect installer artifact
        shell: pwsh
        run: |
          $nsis = "DeskApp/target/release/bundle/nsis"
          if (-not (Test-Path $nsis)) { throw "NSIS klasoru yok: $nsis" }
          $setup = Get-ChildItem $nsis -Filter "*setup.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "setup.exe bulunamadi" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $setup.FullName "dist/RetailEX-Desktop-Setup.exe"
          (Get-Item "dist/RetailEX-Desktop-Setup.exe").Length | Out-Host

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetailEX-Desktop-Setup-${{ env.PACKAGE_VERSION }}
          path: dist/RetailEX-Desktop-Setup.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: RetailEX Desktop ${{ env.PACKAGE_VERSION }}
          body: |
            ## RetailEX Masaüstü (Windows)

            Tauri 2 + NSIS kurulum paketi.

            ### Kurulum
            1. `RetailEX-Desktop-Setup.exe` indirin
            2. Yönetici olarak çalıştırın (per-machine kurulum)
            3. Giriş: demo `admin` / `admin` (yerel PostgreSQL yapılandırmasına bağlı)

            ### Notlar
            - CI derlemesi: kod imzasız (`WINDOWS_CODESIGN_DISABLE`); SmartScreen uyarısı görülebilir
            - Terazi köprüsü ayrı release: **RetailEX Terazi Köprüsü 0.1.91**
            - Sürüm: `${{ env.PACKAGE_VERSION }}` (kök `package.json`)

            ### Dosyalar
            - **RetailEX-Desktop-Setup.exe** — NSIS kurulumu
          files: dist/RetailEX-Desktop-Setup.exe
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
