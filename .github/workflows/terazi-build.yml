name: Terazi Manager Build

# RetailEX TeraziManager (WinForms + Inno Setup)
# Tetikleme:
#   git tag terazi-v1.0.0 && git push origin terazi-v1.0.0
# veya Actions → "Terazi Manager Build" → Run workflow

on:
  push:
    branches:
      - main
    paths:
      - 'TeraziRongta/**'
      - '.github/workflows/terazi-build.yml'
    tags:
      - 'terazi-v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'GitHub Release olustur (tag: terazi-vTARIH)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TERAZI_DIR: TeraziRongta
  BUILD_CONFIG: Release
  BUILD_PLATFORM: x86

jobs:
  build-windows-setup:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Derleme surumu belirle
        id: version
        shell: pwsh
        working-directory: ${{ env.TERAZI_DIR }}
        run: |
          $info = Get-Content "WindowsFormsApplication1\Properties\AssemblyInfo.cs" -Raw
          if ($info -match 'AssemblyVersion\("([0-9]+\.[0-9]+\.[0-9]+)"') {
            $ver = $Matches[1]
          } else {
            $ver = "1.0.0"
          }
          echo "APP_VERSION=$ver" >> $env:GITHUB_ENV

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref }}" -like "refs/tags/terazi-v*") {
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $env:GITHUB_ENV
            echo "SHOULD_RELEASE=true" >> $env:GITHUB_ENV
          } elseif ("${{ inputs.create_release }}" -eq "true") {
            $date = Get-Date -Format "yyyyMMdd-HHmm"
            echo "RELEASE_TAG=terazi-v$date" >> $env:GITHUB_ENV
            echo "SHOULD_RELEASE=true" >> $env:GITHUB_ENV
          } else {
            echo "SHOULD_RELEASE=false" >> $env:GITHUB_ENV
          }

      - name: NuGet restore
        shell: pwsh
        working-directory: ${{ env.TERAZI_DIR }}
        run: |
          nuget restore WindowsFormsApplication1.sln

      - name: MSBuild derleme
        shell: pwsh
        working-directory: ${{ env.TERAZI_DIR }}
        run: |
          msbuild WindowsFormsApplication1.sln `
            /p:Configuration=${{ env.BUILD_CONFIG }} `
            /p:Platform=${{ env.BUILD_PLATFORM }} `
            /p:RestorePackages=false `
            /m

      - name: Staging klasoru hazirla
        shell: pwsh
        working-directory: ${{ env.TERAZI_DIR }}
        run: |
          ./setup/stage-release.ps1 -Configuration ${{ env.BUILD_CONFIG }} -Platform ${{ env.BUILD_PLATFORM }}

      - name: Inno Setup kur
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC bulunamadi: $iscc" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Kurulum paketi derle
        shell: pwsh
        working-directory: ${{ env.TERAZI_DIR }}
        run: |
          & $env:ISCC "setup\TeraziManager.iss" "/DAppVersion=$env:APP_VERSION" "/DStagingDir=staging"

      - name: Tasinabilir zip olustur
        shell: pwsh
        working-directory: ${{ env.TERAZI_DIR }}
        run: |
          $zipName = "RetailEX.TeraziManager-Portable-$env:APP_VERSION.zip"
          $zipPath = Join-Path "setup\output" $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "setup\staging\app\*" -DestinationPath $zipPath
          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Workflow artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: RetailEX.TeraziManager-${{ env.APP_VERSION }}
          path: |
            TeraziRongta/setup/output/RetailEX.TeraziManager-Setup.exe
            TeraziRongta/setup/output/RetailEX.TeraziManager-Portable-${{ env.APP_VERSION }}.zip
          retention-days: 30

      - name: GitHub Release olustur
        if: env.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: RetailEX Terazi Yoneticisi ${{ env.APP_VERSION }}
          body: |
            ## RetailEX Terazi Yoneticisi (Windows)

            Rongta terazi entegrasyonu — masaustu yonetim arayuzu ve istege bagli Windows servisi.

            ### Kurulum
            1. `RetailEX.TeraziManager-Setup.exe` indirin ve yonetici olarak calistirin
            2. `C:\ProgramData\RetailEX\terazi-sync.json` dosyasinda API token ve kiraci kodunu duzenleyin
            3. Terazi Yoneticisi uzerinden baglanti ve senkron testi yapin

            ### Dosyalar
            - **RetailEX.TeraziManager-Setup.exe** — Inno Setup kurulum paketi (x86)
            - **RetailEX.TeraziManager-Portable-${{ env.APP_VERSION }}.zip** — Kurulumsuz tasima paketi

            ### Notlar
            - .NET Framework 4.8 gerekir (Windows 10+)
            - Windows servisi kurulumu kurulum sihirbazinda istege baglidir
            - Surum: `${{ env.APP_VERSION }}`
          files: |
            TeraziRongta/setup/output/RetailEX.TeraziManager-Setup.exe
            TeraziRongta/setup/output/RetailEX.TeraziManager-Portable-${{ env.APP_VERSION }}.zip
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
