name: Android App Release

# RetailEX Capacitor Android APK
# Tetikleme:
#   git tag android-v0.1.207 && git push origin android-v0.1.207
# veya Actions → "Android App Release" → Run workflow

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Read package version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$v" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" = "tag" ] && [[ "${{ github.ref }}" == refs/tags/android-v* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=android-v$v" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Sync Android version and build web assets
        run: |
          node scripts/sync-android-version.mjs
          node scripts/sync-pg-expose.mjs
          npx vite build

      - name: Capacitor sync Android
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -x lint

      - name: Collect APK artifact
        run: |
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          APK_DST="RetailEX-Android-${{ env.PACKAGE_VERSION }}.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "APK bulunamadı: $APK_SRC"
            find android/app/build/outputs -name '*.apk' -ls
            exit 1
          fi
          cp "$APK_SRC" "$APK_DST"
          echo "APK_PATH=$APK_DST" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetailEX-Android-${{ env.PACKAGE_VERSION }}
          path: RetailEX-Android-${{ env.PACKAGE_VERSION }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: RetailEX Android ${{ env.PACKAGE_VERSION }}
          body: |
            RetailEX Android APK (Capacitor 8)

            **Sürüm:** ${{ env.PACKAGE_VERSION }}
            **Dosya:** `RetailEX-Android-${{ env.PACKAGE_VERSION }}.apk`

            Kurulum: APK dosyasını Android cihaza aktarıp yükleyin (bilinmeyen kaynaklara izin gerekebilir).
          files: RetailEX-Android-${{ env.PACKAGE_VERSION }}.apk
          draft: false
          prerelease: false
