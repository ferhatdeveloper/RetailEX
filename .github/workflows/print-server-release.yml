name: Print Server Release

# RetailEX Printer — Windows Setup.exe (Inno) + GitHub Release
# Tag: print-v1.0.0  |  Actions → Run workflow

on:
  push:
    branches:
      - main
    paths:
      - "PrintServer/**"
      - ".github/workflows/print-server-release.yml"
    tags:
      - "print-v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "GitHub Release oluştur (.exe indirme linki)"
        required: false
        default: true
        type: boolean
      version:
        description: "Sürüm (örnek: 1.0.0)"
        required: false
        default: "1.0.0"
        type: string

permissions:
  contents: write

env:
  BUILD_CONFIG: Release

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 9 SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Sürüm ve release bilgisi
        id: meta
        shell: pwsh
        run: |
          $shouldRelease = $false
          $releaseTag = ""
          $appVersion = ""

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -like "print-v*") {
            $tag = "${{ github.ref_name }}"
            if ($tag -match '^print-v(\d+\.\d+\.\d+)$') {
              $appVersion = $Matches[1]
              $shouldRelease = $true
              $releaseTag = $tag
            }
          }
          elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $manual = "${{ inputs.version }}".Trim()
            $should = ("${{ inputs.create_release }}" -eq "true")
            if ($manual -notmatch '^\d+\.\d+\.\d+$') { $manual = "1.0.0" }
            $appVersion = $manual
            if ($should) {
              $shouldRelease = $true
              $releaseTag = "print-v$manual"
            }
          }
          else {
            $appVersion = "0.${{ github.run_number }}.0"
          }

          echo "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          echo "SHOULD_RELEASE=$shouldRelease" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          echo "SETUP_EXE=RetailEX.Printer-Setup-$appVersion.exe" >> $env:GITHUB_ENV
          Write-Host "APP_VERSION=$appVersion SHOULD_RELEASE=$shouldRelease RELEASE_TAG=$releaseTag"

      - name: Restore
        working-directory: PrintServer
        run: dotnet restore QrPrintDesktop.sln

      - name: Test
        working-directory: PrintServer
        run: dotnet test QrPrintDesktop.Tests/QrPrintDesktop.Tests.csproj -c ${{ env.BUILD_CONFIG }} --no-restore --nologo

      - name: Publish tray app (self-contained win-x64)
        working-directory: PrintServer
        shell: pwsh
        run: |
          $out = Join-Path (Resolve-Path .).Path "releases/RetailEX.Printer"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish QrPrintDesktop.App/QrPrintDesktop.App.csproj `
            -c ${{ env.BUILD_CONFIG }} `
            -r win-x64 `
            --self-contained true `
            -o $out `
            --nologo `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:APP_VERSION
          $exe = Join-Path $out "RetailEX.QrPrint.exe"
          if (-not (Test-Path $exe)) { throw "EXE yok: $exe" }
          Write-Host "Publish EXE: $exe"

      - name: Inno Setup kur
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Setup.exe derle
        working-directory: PrintServer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC yok: $iscc" }
          New-Item -ItemType Directory -Force -Path installer\output | Out-Null
          & $iscc "/DMyAppVersion=$env:APP_VERSION" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup başarısız: $LASTEXITCODE" }
          $setup = Join-Path (Resolve-Path installer\output).Path $env:SETUP_EXE
          if (-not (Test-Path $setup)) { throw "Setup.exe yok: $setup" }
          Copy-Item $setup (Join-Path (Resolve-Path releases).Path $env:SETUP_EXE) -Force
          Write-Host "SETUP: $setup ($([math]::Round((Get-Item $setup).Length/1MB,1)) MB)"

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SETUP_EXE }}
          path: PrintServer/installer/output/${{ env.SETUP_EXE }}
          retention-days: 30

      - name: GitHub Release oluştur
        if: env.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: RetailEX Printer ${{ env.APP_VERSION }}
          body: |
            ## RetailEX Printer

            Kurulum: `RetailEX.Printer-Setup-${{ env.APP_VERSION }}.exe` indirip çalıştırın.

            Tepside bırakın (X gizler). Tam çıkış: tepsi → Çıkış.
          files: |
            PrintServer/installer/output/${{ env.SETUP_EXE }}
          draft: false
          prerelease: false
          make_latest: true
