name: Print Server Release

# RetailEX Printer (tray WinForms + Windows service, FastReport 80mm)
# Tetikleyici:
# 1) tag push: print-v{version} (örnek: print-v1.0.0)
# 2) workflow_dispatch (manuel) — varsayılan GitHub Release
# 3) PrintServer/** değişince sadece build + artifact

on:
  push:
    branches:
      - main
    paths:
      - "PrintServer/**"
      - ".github/workflows/print-server-release.yml"
    tags:
      - "print-v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "GitHub Release oluştur (tag: print-v<sürüm>)"
        required: false
        default: true
        type: boolean
      version:
        description: "Sürüm (örnek: 1.0.0). Boşsa tag veya run_number."
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  BUILD_CONFIG: Release

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 9 SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Sürüm ve release bilgisi
        id: meta
        shell: pwsh
        run: |
          $shouldRelease = $false
          $releaseTag = ""
          $appVersion = ""

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -like "print-v*") {
            $tag = "${{ github.ref_name }}"
            if ($tag -match '^print-v(\d+\.\d+\.\d+)$') {
              $appVersion = $Matches[1]
              $shouldRelease = $true
              $releaseTag = $tag
            }
          }
          elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $manual = "${{ inputs.version }}".Trim()
            $should = ("${{ inputs.create_release }}" -eq "true")
            if ($manual -match '^\d+\.\d+\.\d+$') {
              $appVersion = $manual
              if ($should) {
                $shouldRelease = $true
                $releaseTag = "print-v$manual"
              }
            } else {
              $appVersion = "0.${{ github.run_number }}.0"
              if ($should) {
                $shouldRelease = $true
                $releaseTag = "print-v$appVersion"
              }
            }
          }
          else {
            $appVersion = "0.${{ github.run_number }}.0"
          }

          echo "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          echo "SHOULD_RELEASE=$shouldRelease" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          Write-Host "APP_VERSION=$appVersion SHOULD_RELEASE=$shouldRelease RELEASE_TAG=$releaseTag"

      - name: Restore
        working-directory: PrintServer
        run: dotnet restore QrPrintDesktop.sln

      - name: Test
        working-directory: PrintServer
        run: dotnet test QrPrintDesktop.Tests/QrPrintDesktop.Tests.csproj -c ${{ env.BUILD_CONFIG }} --no-restore --nologo

      - name: Publish tray app (self-contained win-x64)
        working-directory: PrintServer
        shell: pwsh
        run: |
          $out = Join-Path (Resolve-Path .).Path "releases/RetailEX.Printer"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish QrPrintDesktop.App/QrPrintDesktop.App.csproj `
            -c ${{ env.BUILD_CONFIG }} `
            -r win-x64 `
            --self-contained true `
            -o $out `
            --nologo `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:APP_VERSION
          $exe = Join-Path $out "RetailEX.QrPrint.exe"
          if (-not (Test-Path $exe)) { throw "EXE yok: $exe" }
          Write-Host "EXE hazır: $exe ($((Get-Item $exe).Length) bytes)"

      - name: Publish Windows service
        working-directory: PrintServer
        shell: pwsh
        run: |
          $svc = Join-Path (Resolve-Path .).Path "releases/RetailEX.Printer/Service"
          New-Item -ItemType Directory -Force -Path $svc | Out-Null
          dotnet publish QrPrintDesktop.Service/QrPrintDesktop.Service.csproj `
            -c ${{ env.BUILD_CONFIG }} `
            -r win-x64 `
            --self-contained true `
            -o $svc `
            --nologo `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:APP_VERSION

      - name: Zip paket
        working-directory: PrintServer
        shell: pwsh
        run: |
          $src = Resolve-Path "releases/RetailEX.Printer"
          $zip = Join-Path (Resolve-Path releases).Path "RetailEX.Printer-win-x64-v$env:APP_VERSION.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $src.Path "*") -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "ZIP: $zip ($([math]::Round((Get-Item $zip).Length/1MB,1)) MB)"

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: RetailEX.Printer-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: |
            PrintServer/releases/RetailEX.Printer-win-x64-v${{ env.APP_VERSION }}.zip
            PrintServer/releases/RetailEX.Printer/RetailEX.QrPrint.exe
          retention-days: 30

      - name: GitHub Release oluştur
        if: env.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: RetailEX Printer ${{ env.APP_VERSION }}
          body: |
            ## RetailEX Printer (Windows)

            Otomatik derleme: `${{ github.workflow }}` (#${{ github.run_number }})

            ### Kurulum
            1. `RetailEX.Printer-win-x64-v${{ env.APP_VERSION }}.zip` indirin ve klasörü açın
            2. `RetailEX.QrPrint.exe` çalıştırın (tepsi önerilir)
            3. Tenant, firma, dönem ve mutfak yazıcısını kaydedin

            Tek dosyayı ayırmayın. FastReport DLL’leri ve `Reports` aynı klasörde kalmalı.

            Servis (yönetici): `install-service.ps1`

            Sürüm: `${{ env.APP_VERSION }}`
          files: |
            PrintServer/releases/RetailEX.Printer-win-x64-v${{ env.APP_VERSION }}.zip
          draft: false
          prerelease: false
          make_latest: true
