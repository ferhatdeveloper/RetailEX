[package]
name = "retailex-logo-connector"
version = "1.0.0"
edition = "2021"
authors = ["RetailEX Team"]
description = "RetailEX Logo ERP bridge — MSSQL Logo Tiger ↔ PostgreSQL (Windows service)"
publish = false

[[bin]]
name = "RetailEX-Logo-Connector"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
futures-lite = "2.1"
serde_json = "1.0"
sqlx = { version = "0.7", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json", "bigdecimal"] }
tiberius = { version = "0.12", default-features = false, features = ["chrono", "time", "rust_decimal", "rustls"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-service = "0.7"

[target.'cfg(windows)'.dependencies]
# Windows-only; cross-compile hedefi x86_64-pc-windows-gnu

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
