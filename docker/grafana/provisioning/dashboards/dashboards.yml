apiVersion: 1

providers:
  - name: RetailEX
    orgId: 1
    folder: RetailEX
    type: file
    # true: diskte olmayan panoları Grafana’dan silme (API ile yüklenenler kalsın)
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
